<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} - Python-100-Days</title>
  <script>
    // Apply the theme before first paint to avoid a flash of the wrong
    // theme. Priority: saved preference > system preference.
    (function () {
      try {
        var saved = localStorage.getItem('theme-preference');
        var theme = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="{{BASE_PATH}}/site/styles.css">
  <link rel="stylesheet" id="hljs-light" href="{{BASE_PATH}}/site/vendor/github.min.css">
  <link rel="stylesheet" id="hljs-dark" href="{{BASE_PATH}}/site/vendor/github-dark.min.css" disabled>
</head>
<body data-has-sidebar="{{HAS_SIDEBAR}}" data-current-path="{{CURRENT_PATH}}" data-base-path="{{BASE_PATH}}" data-nav-tree="{{NAV_TREE}}">
  <div class="page-wrapper">
    <header class="site-header">
      <div class="header-inner">
        <button type="button" class="sidebar-toggle" aria-label="切换侧边栏" title="切换侧边栏">☰</button>
        <a class="site-title" href="{{BASE_PATH}}/README.html">Python-100-Days</a>
        <span class="site-subtitle">从新手到大师</span>
        <a class="back-link" href="{{BASE_PATH}}/README.html">返回目录</a>
        <button type="button" class="theme-toggle" aria-label="切换主题" title="切换到夜间主题">
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>
    <div class="main-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">目录</span>
        </div>
        <nav class="tree-menu" id="tree-menu"></nav>
      </aside>
      <div class="content-area">
        <main class="content">
          {{CONTENT}}
        </main>
        <footer class="site-footer">
          <p>基于 <a href="https://github.com/jackfrued/Python-100-Days" target="_blank">Python-100-Days</a> 构建 · 代码块支持点击运行</p>
        </footer>
      </div>
    </div>
  </div>
  <script src="{{BASE_PATH}}/site/vendor/highlight.min.js"></script>
  <script src="{{BASE_PATH}}/site/runner.js"></script>
  <script src="{{BASE_PATH}}/site/menu.js"></script>
  <script src="{{BASE_PATH}}/site/theme.js"></script>
</body>
</html>
